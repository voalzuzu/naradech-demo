<!DOCTYPE html>

<style>

body { font-family:'Sarabun',sans-serif; background:linear-gradient(135deg,#f8faff 0%,#eef2fa 100%); min-height:100vh; }

.btn-primary:hover { opacity:.88; }
.btn-secondary { background:rgba(255,255,255,0.65); color:#334155; border:1px solid rgba(255,255,255,0.7); border-radius:18px; padding:10px 20px; font-weight:600; cursor:pointer; backdrop-filter:blur(12px); transition:background .2s; }
.btn-secondary:hover { background:rgba(255,255,255,.88); }
.btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); color:white; border:1px solid rgba(255,255,255,0.3); border-radius:18px; padding:10px 20px; font-weight:600; cursor:pointer; }
.input-field { width:100%; border:1px solid rgba(255,255,255,0.7); background:rgba(255,255,255,0.65); border-radius:16px; padding:10px 16px; outline:none; font-size:14px; backdrop-filter:blur(12px); transition:border .2s; font-family:'Sarabun',sans-serif; }
.input-field:focus { border-color:rgba(124,108,255,0.6); background:rgba(255,255,255,.88); }
textarea.input-field { min-height:80px; resize:vertical; }
.nav-btn { width:100%; display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:16px; font-weight:600; font-size:14px; cursor:pointer; border:none; background:transparent; color:#64748b; transition:all .2s; text-align:left; }
.nav-btn:hover { background:rgba(255,255,255,0.55); }
.nav-btn.active { background:linear-gradient(135deg,#4F5DFF,#7C6CFF); color:white; box-shadow:0 8px 24px rgba(92,103,255,0.28); }

.badge-red { background:rgba(255,241,242,0.9); color:#be123c; border-color:rgba(252,165,165,0.7); }
.badge-yellow { background:rgba(255,251,235,0.9); color:#92400e; border-color:rgba(252,211,77,0.7); }
.badge-blue { background:rgba(239,246,255,0.9); color:#1e40af; border-color:rgba(147,197,253,0.7); }

.badge-orange { background:rgba(255,247,237,0.9); color:#c2410c; border-color:rgba(253,186,116,0.7); }
.toast { position:fixed; top:16px; right:16px; z-index:99; max-width:360px; padding:14px 18px; border-radius:20px; background:rgba(255,255,255,0.92); border:1px solid rgba(255,255,255,0.7); backdrop-filter:blur(20px); box-shadow:0 12px 40px rgba(92,103,255,0.18); display:flex; align-items:center; gap:10px; font-weight:600; }

@media(max-width:1023px){ #sidebar{ display:none; } #main{ margin-left:0 !important; } }

<body>

<div id="toast" class="toast" style="display:none">

<div id="modal-overlay" class="modal-overlay" style="display:none"></div>

<div id="login-page">

        <div class="logo-sub">เลี่ยมกรอบพระ</div>
      </div>
      <nav id="nav-list" style="flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;"></nav>
      <div style="border-top:1px solid rgba(255,255,255,0.6);padding-top:12px;margin-top:8px;">

            <div id="user-name" style="font-weight:700;font-size:14px;"></div>
            <div id="user-role" style="font-size:12px;color:#94a3b8;"></div>

          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="main" style="margin-left:260px;min-height:100vh;display:flex;flex-direction:column;">
    <header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.6);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.6);padding:16px 24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
        <div>
          <div style="font-size:11px;font-weight:600;letter-spacing:0.2em;color:#94a3b8;text-transform:uppercase;">นราเดช เลี่ยมกรอบพระ</div>
          <h1 id="page-title" style="font-size:22px;font-weight:800;color:#0f172a;margin-top:2px;"></h1>
        </div>
        <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.8);border-radius:16px;padding:8px 14px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M21 21l-4.35-4.35M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z"/></svg>
          <input id="search-input" oninput="onSearch(this.value)" placeholder="ค้นหางาน ลูกค้า เบอร์..." style="border:none;background:transparent;outline:none;font-size:13px;width:180px;font-family:'Sarabun',sans-serif;"/>
        </div>
      </div>
    </header>
    <div id="content" style="padding:20px 24px;max-width:1280px;flex:1;"></div>
  </div>
</div>

<script>

const stockCatalog=[
  {id:'ac1',label:'อะคริลิค 1mm',unit:'แผ่น',price:25},
  {id:'ac2',label:'อะคริลิค 2mm',unit:'แผ่น',price:50},

  {id:'ac3',label:'อะคริลิค 3mm',unit:'แผ่น',price:70},
  {id:'ac4',label:'อะคริลิค 4mm',unit:'แผ่น',price:90},
  {id:'gas',label:'แก๊ส',unit:'กระป๋อง',price:60},
  {id:'liq',label:'น้ำยาอะคริลิค',unit:'ขวด',price:200},
  {id:'hook',label:'ห่วง',unit:'ชิ้น',price:50},
  {id:'zip',label:'ถุงซิป',unit:'ใบ',price:5},
  {id:'bag',label:'ถุงผ้า',unit:'ใบ',price:25},

function initWithdrawals(){

function load(k,fb){try{return JSON.parse(localStorage.getItem(k))||fb;}catch(e){return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ─── Nav ──────────────────────────────────────────────────────────────────────
const navItems=[
  {key:'jobs',label:'งานทั้งหมด',icon:'list'},
  {key:'create',label:'รับงานใหม่',icon:'plus'},
  {key:'notifications',label:'แจ้งเตือน',icon:'bell'},
  {key:'customers',label:'ลูกค้า',icon:'users'},
  {key:'attendance',label:'ลงเวลา',icon:'clock',staffOnly:true},
  {key:'withdraw',label:'เบิกวัสดุ',icon:'box'},
  {key:'dashboard',label:'Dashboard',icon:'chart',ownerOnly:true},
  {key:'approvals',label:'อนุมัติ',icon:'alert',ownerOnly:true},
  {key:'reports',label:'รายงาน',icon:'sheet',ownerOnly:true},
];
const IC={
  list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  plus:'M12 5v14M5 12h14',chart:'M3 3v18h18M7 16v-5M12 16V7M17 16v-9',
  bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0',

  box:'M21 8a2 2 0 0 0-1-1.73L13 2.27a2 2 0 0 0-2 0L4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8ZM3.3 7.2 12 12l8.7-4.8M12 22V12',
  sheet:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6ZM14 2v6h6M8 13h8M8 17h8',
  copy:'M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M8 2h8a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v0a2 2 0 0 1 2-2Z',
  phone:'M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4 12.91 19.8 19.8 0 0 1 1.08 4.18 2 2 0 0 1 3.06 2h3a2 2 0 0 1 2 1.72c.12.86.32 1.7.59 2.5a2 2 0 0 1-.45 2.11L7.91 9.1a16 16 0 0 0 6 6l.77-1.3a2 2 0 0 1 2.11-.45c.8.27 1.64.47 2.5.59A2 2 0 0 1 22 16.92Z',

function icon(n,s='18'){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+(IC[n]||IC.list)+'"/></svg>';}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function money(v){return new Intl.NumberFormat('th-TH').format(Math.round(v||0));}
function dateText(v){if(!v)return '-';return new Date(v).toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'});}
function nowTime(){return new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});}
function todayStr(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function nextJobNo(){const d=new Date(),y=String(d.getFullYear()).slice(-2),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');const pre='NRD-'+y+m+day;const c=state.jobs.filter(j=>j.jobNo.startsWith(pre)).length+1;return pre+'-'+String(c).padStart(3,'0');}
function statusBadge(s){const map={'เสร็จแล้ว':'badge-green','ลูกค้ารับแล้ว':'badge-green','ยกเลิก':'badge-red','พบปัญหา':'badge-yellow','รอข้อมูล':'badge-yellow','แก้ไขใหม่':'badge-violet','กำลังทำ':'badge-blue','รับงาน':'badge-gray'};return '<span class="badge '+(map[s]||'badge-gray')+'">'+s+'</span>';}
function paidBadge(p){return '<span class="badge '+(p?'badge-green':'badge-red')+'">'+(p?'ชำระแล้ว':'ค้างชำระ')+'</span>';}
function deadlineInfo(job){if(['เสร็จแล้ว','ลูกค้ารับแล้ว','ยกเลิก'].includes(job.status))return null;const today=new Date();today.setHours(0,0,0,0);const due=new Date(job.deliveryDate);due.setHours(0,0,0,0);const diff=Math.round((due-today)/86400000);if(diff<0)return{label:'เกินกำหนด',cls:'badge-red'};if(diff<=1)return{label:'ใกล้ครบกำหนด',cls:'badge-orange'};return null;}
function showToast(msg){const t=document.getElementById('toast'),tx=document.getElementById('toast-text');t.style.display='flex';tx.textContent=msg;if(state.toastTimer)clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>{t.style.display='none';},2600);}
function kpiCard(title,value,ic){return '<div class="glass" style="padding:18px;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div style="font-size:13px;color:#64748b;">'+title+'</div><div style="font-size:26px;font-weight:800;margin-top:4px;">'+value+'</div></div><div style="background:rgba(255,255,255,0.7);border-radius:14px;padding:10px;color:#5B5CFF;">'+icon(ic,'20')+'</div></div></div>';}
function infoRow(k,v){return '<div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.5);border-radius:12px;padding:8px 12px;font-size:13px;"><span style="color:#64748b;">'+k+'</span><span style="font-weight:600;">'+esc(v)+'</span></div>';}
function pBox(label,active,disabled,jid,type){const dis=disabled?'opacity:.5;cursor:not-allowed;':'cursor:pointer;';const oc=disabled?'':' onclick="togglePhoto('+jid+',\''+type+'\')"';return '<button'+oc+' style="width:100%;border:2px dashed '+(active?'#34d399':'rgba(124,108,255,0.3)')+';border-radius:20px;padding:18px;text-align:center;background:'+(active?'rgba(236,253,245,0.6)':'rgba(255,255,255,0.4)')+';'+dis+'"><div style="color:'+(active?'#059669':'#94a3b8')+'">'+icon(active?'check':'camera','28')+'</div><div style="font-weight:600;margin-top:6px;font-size:13px;color:'+(active?'#059669':'#475569')+'">'+label+'</div><div style="font-size:11px;color:#94a3b8;margin-top:2px;">'+(active?'เพิ่มแล้ว':disabled?'ยังไม่สามารถเพิ่มได้':'แตะเพื่อเพิ่มตัวอย่าง')+'</div></button>';}

// ─── Auth ─────────────────────────────────────────────────────────────────────
const ACCOUNTS=[
  {username:'owner',password:'1234',role:'Owner',name:'เจ้าของ'},
  {username:'chang1',password:'1234',role:'Staff',name:'ช่าง 1'},
  {username:'chang2',password:'1234',role:'Staff',name:'ช่าง 2'},
];
function doLogin(){
  const u=(document.getElementById('login-user')?.value||'').trim().toLowerCase();
  const p=(document.getElementById('login-pass')?.value||'');
  const acc=ACCOUNTS.find(a=>a.username===u&&a.password===p);
  const errEl=document.getElementById('login-err');
  if(!acc){errEl.style.display='block';setTimeout(()=>{errEl.style.display='none';},2500);return;}
  errEl.style.display='none';
  login(acc.role,acc.name);
}
function login(role,name){state.role=role;state.staffName=name;document.getElementById('login-page').style.display='none';document.getElementById('app').style.display='block';document.getElementById('user-avatar').textContent=name[0];document.getElementById('user-name').textContent=name;document.getElementById('user-role').textContent=role==='Owner'?'เจ้าของ':'ช่าง';renderNav();navigateTo('jobs');}
function logout(){state.role=null;document.getElementById('app').style.display='none';document.getElementById('login-page').style.display='block';document.getElementById('login-user').value='';document.getElementById('login-pass').value='';}

function renderNav(){
  const visible=navItems.filter(i=>{if(i.ownerOnly)return state.role==='Owner';if(i.staffOnly)return state.role==='Staff';return true;});
  const apvCount=state.role==='Owner'?state.approvals.length:0;
  document.getElementById('nav-list').innerHTML=visible.map(i=>{
    const badge=(i.key==='approvals'&&apvCount)?'<span style="margin-left:auto;background:#ef4444;color:white;border-radius:99px;padding:0 7px;font-size:11px;">'+apvCount+'</span>':'';
    return '<button class="nav-btn'+(state.page===i.key?' active':'')+'" onclick="navigateTo(\''+i.key+'\')">'+icon(i.icon,'16')+i.label+badge+'</button>';
  }).join('');
}
function navigateTo(page){state.page=page;renderNav();const titles={jobs:'งานทั้งหมด',create:'รับงานใหม่',dashboard:'Dashboard',notifications:'แจ้งเตือน',customers:'ลูกค้า',detail:'รายละเอียดงาน',attendance:'ลงเวลา',withdraw:'เบิกวัสดุ',approvals:'อนุมัติ',reports:'รายงาน'};document.getElementById('page-title').textContent=titles[page]||page;document.getElementById('search-input').value=state.searchQuery;renderPage();}
function onSearch(q){state.searchQuery=q;if(state.page==='jobs')renderPage();}

function renderPage(){const p=state.page;if(p==='jobs')renderJobs();else if(p==='create')renderCreate();else if(p==='dashboard')renderDashboard();else if(p==='notifications')renderNotifications();else if(p==='customers')renderCustomers();else if(p==='detail')renderDetail();else if(p==='attendance')renderAttendance();else if(p==='withdraw')renderWithdraw();else if(p==='approvals')renderApprovals();else if(p==='reports')renderReports();}

// ─── Jobs Page ─────────────────────────────────────────────────────────────────
function renderJobs(){
  const q=state.searchQuery.toLowerCase();
  const jobs=state.jobs.filter(j=>{if(!q)return true;return[j.jobNo,j.customer,j.phone,j.details,...j.types].some(v=>String(v).toLowerCase().includes(q));}).sort((a,b)=>new Date(b.receiveDate)-new Date(a.receiveDate));
  const open=state.jobs.filter(j=>!['เสร็จแล้ว','ลูกค้ารับแล้ว','ยกเลิก'].includes(j.status)).length;
  const unpaid=state.jobs.filter(j=>!j.paid&&j.status!=='ยกเลิก').length;
  const rows=jobs.length?jobs.map(j=>{
    const dl=deadlineInfo(j);
    const delBtn=state.role==='Owner'
      ?'<button class="btn-secondary" style="padding:6px 10px;" onclick="deleteJobConfirm('+j.id+')">'+icon('trash','14')+'</button>'
      :'<button class="btn-secondary" style="padding:6px 10px;" title="ขอลบ" onclick="requestDelete('+j.id+')">'+icon('trash','14')+'</button>';
    return '<div class="glass" style="padding:16px 20px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr 1fr auto auto auto;gap:12px;align-items:center;">'+
      '<div><div style="font-weight:700;font-size:14px;">'+j.jobNo+'</div><div style="font-size:12px;color:#94a3b8;">'+dateText(j.receiveDate)+' · '+j.receiveTime+'</div></div>'+
      '<div><div style="font-weight:600;">'+esc(j.customer)+'</div><div style="font-size:12px;color:#94a3b8;">'+esc(j.phone)+(j.line?' · LINE: '+esc(j.line):'')+'</div></div>'+
      '<div><div style="font-size:13px;color:#475569;">'+j.types.join(', ')+'</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">'+statusBadge(j.status)+(dl?'<span class="badge '+dl.cls+'">'+dl.label+'</span>':'')+'</div></div>'+
      '<div style="text-align:right;"><div style="font-weight:700;">'+money(j.price)+' ฿</div>'+paidBadge(j.paid)+'</div>'+
      '<div style="text-align:center;font-size:12px;color:#64748b;">'+dateText(j.deliveryDate)+'</div>'+
      '<div style="display:flex;gap:6px;"><button class="btn-secondary" style="padding:6px 10px;" onclick="openDetail('+j.id+')">'+icon('arrowLeft','14')+'</button>'+delBtn+'</div>'+
    '</div>';
  }).join(''):'<div class="glass" style="padding:48px;text-align:center;color:#94a3b8;">ไม่พบงาน</div>';
  document.getElementById('content').innerHTML=
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">'+kpiCard('งานทั้งหมด',state.jobs.length,'list')+kpiCard('งานค้างอยู่',open,'clock')+kpiCard('ค้างชำระ',unpaid,'wallet')+'</div>'+
    '<button class="btn-primary" style="margin-bottom:16px;" onclick="navigateTo(\'create\')">'+icon('plus','14')+' รับงานใหม่</button>'+rows;
}

function copyMsg(jobId){
  const job=state.jobs.find(j=>j.id===jobId);if(!job)return;
  const msg='📿 แจ้งงาน นราเดช เลี่ยมกรอบพระ\n\nเลขงาน: '+job.jobNo+'\nลูกค้า: '+job.customer+'\nประเภท: '+job.types.join(', ')+'\nราคา: '+money(job.price)+' ฿ ('+(job.paid?'ชำระแล้ว':'ค้างชำระ')+')\nวันนัดส่ง: '+dateText(job.deliveryDate)+' '+job.deliveryTime+'\n\nขอบคุณที่ใช้บริการครับ 🙏';
  navigator.clipboard.writeText(msg).then(()=>showToast('คัดลอกข้อความแล้ว')).catch(()=>showToast('กรุณา copy ด้วยมือจากกล่องด้านบน'));
}

function changeStatus(id,status){
  const job=state.jobs.find(j=>j.id===id);if(!job)return;
  if(status==='เสร็จแล้ว'&&!job.afterPhoto){showToast('ต้องเพิ่มรูปหลังทำงานก่อนจึงจะ "เสร็จแล้ว" ได้');return;}
  updateJob(id,{status});showToast('อัปเดตสถานะเป็น: '+status);renderDetail();
}
function togglePhoto(id,type){const job=state.jobs.find(j=>j.id===id);if(!job)return;updateJob(id,type==='before'?{beforePhoto:!job.beforePhoto}:{afterPhoto:!job.afterPhoto});showToast('อัปเดตรูปภาพแล้ว');renderDetail();}
function togglePaid(id){const job=state.jobs.find(j=>j.id===id);if(!job)return;updateJob(id,{paid:!job.paid});showToast(job.paid?'ทำเครื่องหมายค้างชำระแล้ว':'บันทึกการชำระแล้ว');renderDetail();}
function deleteJobConfirm(id){const job=state.jobs.find(j=>j.id===id);if(!job)return;if(confirm('ลบงาน '+job.jobNo+' ของ '+job.customer+' ใช่ไหม? ไม่สามารถเรียกคืนได้')){state.jobs=state.jobs.filter(j=>j.id!==id);save('nrd_jobs',state.jobs);showToast('ลบงานแล้ว');navigateTo('jobs');}}
function requestDelete(id){const job=state.jobs.find(j=>j.id===id);if(!job)return;if(!confirm('ขอลบงาน '+job.jobNo+'? เจ้าของต้องอนุมัติก่อน'))return;const req={id:Date.now(),type:'delete',jobId:id,jobNo:job.jobNo,by:state.staffName,at:new Date().toLocaleString('th-TH'),snapshot:job};state.approvals=[req,...state.approvals];save('nrd_apv',state.approvals);showToast('ส่งคำขอลบไปยังเจ้าของแล้ว');renderNav();}
function updateJob(id,patch){state.jobs=state.jobs.map(j=>j.id===id?Object.assign({},j,patch):j);save('nrd_jobs',state.jobs);}

function fld(label,type,key,id,val,ph){return '<label><div style="font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">'+label+'</div><input class="input-field" type="'+type+'" id="'+id+'" value="'+esc(val)+'" placeholder="'+(ph||'')+'" oninput="CF[\''+key+'\']=this.value"/></label>';}
function selFld(label,id,opts,val){return '<label><div style="font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">'+label+'</div><select class="input-field" id="'+id+'" onchange="CF[\''+id.replace('cf_','')+'\']=this.value">'+opts.map(o=>'<option value="'+o+'"'+(o===val?' selected':'')+'>'+o+'</option>').join('')+'</select></label>';}
function toggleType(t){if(CF.types.includes(t))CF.types=CF.types.filter(x=>x!==t);else CF.types=[...CF.types,t];renderCreate();}
function fillCustomer(name,phone,line){CF.customer=name;CF.phone=phone;CF.line=line;CF._csq='';renderCreate();setTimeout(()=>{const c=document.getElementById('cf_customer');if(c)c.value=name;const p=document.getElementById('cf_phone');if(p)p.value=phone;const l=document.getElementById('cf_line');if(l)l.value=line;},50);}
function submitJob(jno){
  const customer=(document.getElementById('cf_customer')?.value||CF.customer||'').trim();
  const phone=(document.getElementById('cf_phone')?.value||CF.phone||'').trim();
  if(!customer||!phone){showToast('กรุณาใส่ชื่อลูกค้าและเบอร์โทร');return;}
  if(!CF.beforePhoto){showToast('กรุณาถ่ายรูปรับงานก่อนบันทึก');return;}
  const fullPrice=Number(document.getElementById('cf_price')?.value)||0;
  const discount=Number(document.getElementById('cf_discount')?.value)||0;
  const netPrice=Math.max(0,fullPrice-discount);
  const newJob={id:Date.now(),jobNo:jno,customer,phone,line:document.getElementById('cf_line')?.value||'',receiveDate:document.getElementById('cf_receiveDate').value,receiveTime:document.getElementById('cf_receiveTime').value,deliveryDate:document.getElementById('cf_deliveryDate').value,deliveryTime:document.getElementById('cf_deliveryTime').value,types:CF.types.length?CF.types:['อื่นๆ'],pieces:Number(document.getElementById('cf_pieces').value)||1,price:netPrice,fullPrice,discount,paid:document.getElementById('cf_paid').value==='ชำระแล้ว',payMethod:document.getElementById('cf_payMethod').value,status:'รับงาน',details:document.getElementById('cf_details').value,staff:state.staffName,beforePhoto:true,afterPhoto:false,notes:document.getElementById('cf_notes')?.value||''};
  state.jobs=[newJob,...state.jobs];save('nrd_jobs',state.jobs);CF={};showToast('บันทึกงาน '+jno+' แล้ว');navigateTo('jobs');
}

// ─── Attendance ─────────────────────────────────────────────────────────────────
function renderAttendance(){
  const today=todayStr();
  const my=state.attendance.filter(r=>r.staff===state.staffName);
  const tr=my.find(r=>r.date===today);
  function calcRec(r){if(!r||!r.checkIn||!r.checkOut)return{work:0,ot:0,otAmt:0};const[sh,sm]=r.checkIn.split(':').map(Number);const[eh,em]=r.checkOut.split(':').map(Number);const gross=(eh*60+em)-(sh*60+sm);const work=Math.max(0,gross-(r.breakMin||60));const ot=Math.max(0,(eh*60+em)-17*60);return{work,ot,otAmt:Math.round(ot/60*(r.otRate||70))};}
  function hm(m){const h=Math.floor(m/60),min=m%60;return h+'h '+String(min).padStart(2,'0')+'m';}
  const tc=calcRec(tr);
  document.getElementById('content').innerHTML=
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">'+
      kpiCard('สถานะวันนี้',tr?tr.status:'ยังไม่ลงเวลา','clock')+kpiCard('เวลาเข้างาน',tr?.checkIn||'-','check')+kpiCard('เวลาออกงาน',tr?.checkOut||'-','logout')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;">'+
      '<button onclick="openClockModal(\'in\')" style="background:linear-gradient(135deg,rgba(79,93,255,0.85),rgba(124,108,255,0.85));border:1px solid rgba(255,255,255,0.3);border-radius:24px;padding:32px;text-align:left;cursor:pointer;color:white;">'+
        icon('camera','36')+'<div style="font-size:20px;font-weight:800;margin-top:16px;">ลงเวลาเข้างาน</div><div style="font-size:13px;opacity:0.7;margin-top:4px;">ถ่ายรูปยืนยัน ก่อนเข้างาน</div>'+
      '</button>'+
      '<button onclick="openClockModal(\'out\')" class="glass" style="padding:32px;text-align:left;cursor:pointer;border:none;">'+
        icon('camera','36')+'<div style="font-size:20px;font-weight:800;margin-top:16px;">ลงเวลาออกงาน</div><div style="font-size:13px;color:#94a3b8;margin-top:4px;">ถ่ายรูปยืนยัน ก่อนออกงาน</div>'+
      '</button>'+
    '</div>'+
    '<div class="glass" style="overflow:hidden;">'+
      '<div style="padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.6);font-weight:700;">ประวัติการทำงาน</div>'+
      (my.length?my.map(r=>{const c=calcRec(r);return'<div style="padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.4);display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr;gap:12px;align-items:center;font-size:13px;">'+
        '<div><div style="font-weight:700;">'+dateText(r.date)+'</div><span class="badge badge-gray">'+r.status+'</span></div>'+
        '<div>เข้า: <b>'+(r.checkIn||'-')+'</b></div>'+
        '<div>ออก: <b>'+(r.checkOut||'-')+'</b></div>'+
        '<div>ทำงาน: <b>'+hm(c.work)+'</b></div>'+
        '<div>OT: <b>'+money(c.otAmt)+' ฿</b></div>'+
      '</div>';}).join(''):'<div style="padding:40px;text-align:center;color:#94a3b8;">ยังไม่มีประวัติ</div>')+
    '</div>';
}
function openClockModal(type){
  const today=todayStr();
  if(type==='in'&&state.attendance.some(r=>r.staff===state.staffName&&r.date===today&&r.checkIn)){showToast('ลงเวลาเข้าวันนี้ไปแล้ว');return;}
  if(type==='out'){const rec=state.attendance.find(r=>r.staff===state.staffName&&r.date===today);if(!rec?.checkIn){showToast('กรุณาลงเวลาเข้าก่อน');return;}if(rec?.checkOut){showToast('ลงเวลาออกวันนี้ไปแล้ว');return;}}
  const label=type==='in'?'เข้างาน':'ออกงาน';
  const o=document.getElementById('modal-overlay');o.style.display='flex';
  o.innerHTML='<div class="glass" style="width:100%;max-width:480px;padding:32px;text-align:center;">'+
    '<div style="font-size:48px;margin-bottom:12px;">📷</div>'+

    '<div style="display:flex;gap:10px;">'+
      '<button class="btn-secondary" style="flex:1;" onclick="closeModal()">ยกเลิก</button>'+

    '</div>'+
  '</div>';
}
function confirmClock(type){
  const today=todayStr();const time=nowTime();
  if(type==='in'){state.attendance=[{id:Date.now(),staff:state.staffName,date:today,checkIn:time,checkOut:'',breakMin:60,otRate:70,status:'ลงงานแล้ว',checkInPhoto:true,checkOutPhoto:false},...state.attendance];}
  else{state.attendance=state.attendance.map(r=>r.staff===state.staffName&&r.date===today?{...r,checkOut:time,status:'ออกงานแล้ว',checkOutPhoto:true}:r);}
  save('nrd_att',state.attendance);closeModal();showToast('ถ่ายรูปและลงเวลา'+(type==='in'?'เข้า':'ออก')+'งานแล้ว ('+time+')');renderAttendance();
}

        '<div><div style="font-weight:700;">'+r.refNo+'</div><div style="font-size:12px;color:#94a3b8;">'+dateText(r.date)+' '+r.time+'</div></div>'+
        '<div>'+r.item+'<div style="font-size:12px;color:#94a3b8;">'+(r.note||'-')+'</div></div>'+
        '<span class="badge badge-gray">'+r.qty+' '+r.unit+'</span>'+
        (state.role==='Owner'?'<div style="font-weight:700;">'+money(r.total)+' ฿</div>':'<div></div>')+
        '<div style="font-size:12px;color:#64748b;">'+r.staff+'</div>'+
      '</div>').join(''):'<div style="padding:40px;text-align:center;color:#94a3b8;">ยังไม่มีรายการ</div>')+
    '</div>';
}
function wFld(label,type,key,id,val,ph){return '<label><div style="font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">'+label+'</div><input class="input-field" type="'+type+'" id="'+id+'" value="'+esc(String(val||''))+'" placeholder="'+(ph||'')+'" oninput="WF[\''+key+'\']=this.value"/></label>';}
function onWdSel(key,val){
  if(key==='refType'){WF.refType=val==='งานลูกค้า'?'job':'other';renderWithdraw();return;}
  if(key==='jobNo'){WF.jobNo=val;return;}
  if(key==='item'){WF.itemId=val;renderWithdraw();return;}
}
function submitWithdraw(){
  const stk=stockCatalog.find(i=>i.id===WF.itemId)||stockCatalog[0];
  const qty=Number(document.getElementById('wd_qty')?.value)||1;
  const refNo=WF.refType==='job'?WF.jobNo:'WDN-'+todayStr().replace(/-/g,'')+'-'+String(state.withdrawals.length+1).padStart(3,'0');
  const rec={id:Date.now(),date:document.getElementById('wd_date')?.value||todayStr(),time:document.getElementById('wd_time')?.value||nowTime(),refNo,refType:WF.refType,staff:state.staffName,item:stk.label,qty,unit:stk.unit,unitPrice:stk.price,total:qty*stk.price,note:document.getElementById('wd_note')?.value||''};
  state.withdrawals=[rec,...state.withdrawals];save('nrd_wd',state.withdrawals);
  WF={};showToast('บันทึกการเบิก '+stk.label+' แล้ว');renderWithdraw();
}

// ─── Approvals ─────────────────────────────────────────────────────────────────
function renderApprovals(){
  const apvs=state.approvals;
  document.getElementById('content').innerHTML=
    '<div style="margin-bottom:20px;">'+kpiCard('รอการอนุมัติ',apvs.length,'alert')+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:12px;">'+
    (apvs.length?apvs.map(r=>'<div class="glass" style="padding:20px;">'+
      '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;">'+
        '<div><span class="badge '+(r.type==='delete'?'badge-red':'badge-blue')+'">'+(r.type==='delete'?'คำขอลบ':'คำขอแก้ไข')+'</span>'+
          '<div style="font-size:20px;font-weight:800;margin-top:6px;">'+r.jobNo+'</div>'+
          '<div style="font-size:13px;color:#94a3b8;">โดย '+esc(r.by)+' · '+r.at+'</div></div>'+
        '<div style="display:flex;gap:8px;"><button class="btn-secondary" onclick="rejectApv('+r.id+')">ปฏิเสธ</button><button class="btn-primary" onclick="approveApv('+r.id+')">อนุมัติ</button></div>'+
      '</div>'+
      (r.patch?'<div style="background:rgba(255,255,255,0.5);border-radius:14px;padding:12px;font-size:13px;color:#475569;"><b>การเปลี่ยนแปลง:</b> '+Object.entries(r.patch).map(([k,v])=>k+': '+esc(String(v))).join(' · ')+'</div>':
       r.type==='delete'?'<div style="background:rgba(254,226,226,0.5);border-radius:14px;padding:12px;font-size:13px;color:#be123c;">ขอลบงาน '+r.jobNo+'</div>':'')+
    '</div>').join(''):'<div class="glass" style="padding:48px;text-align:center;color:#94a3b8;">ไม่มีคำขออนุมัติ</div>')+
    '</div>';
}
function approveApv(id){const req=state.approvals.find(r=>r.id===id);if(!req)return;if(req.type==='delete'){state.jobs=state.jobs.filter(j=>j.id!==req.jobId);save('nrd_jobs',state.jobs);}if(req.type==='edit'&&req.patch){updateJob(req.jobId,req.patch);}state.approvals=state.approvals.filter(r=>r.id!==id);save('nrd_apv',state.approvals);showToast('อนุมัติ '+req.jobNo+' แล้ว');renderApprovals();renderNav();}
function rejectApv(id){const req=state.approvals.find(r=>r.id===id);state.approvals=state.approvals.filter(r=>r.id!==id);save('nrd_apv',state.approvals);showToast('ปฏิเสธคำขอ '+(req?.jobNo||'')+' แล้ว');renderApprovals();renderNav();}

// ─── Reports ───────────────────────────────────────────────────────────────────
function renderReports(){
  const jobs=state.jobs;
  const rev=jobs.filter(j=>j.paid&&j.status!=='ยกเลิก').reduce((s,j)=>s+j.price,0);
  const wdCost=state.withdrawals.reduce((s,r)=>s+r.total,0);
  document.getElementById('content').innerHTML=
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">'+kpiCard('รายได้รวม',money(rev)+' ฿','wallet')+kpiCard('งานทั้งหมด',jobs.length,'list')+kpiCard('ต้นทุนวัสดุ',money(wdCost)+' ฿','box')+'</div>'+
    '<div class="glass" style="overflow:hidden;">'+
      '<div style="padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.6);font-weight:700;">ตารางงานทั้งหมด</div>'+
      '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">'+
        '<thead><tr style="background:rgba(255,255,255,0.35);">'+['เลขงาน','ลูกค้า','ช่าง','สถานะ','ชำระ','ราคา','วันนัดส่ง'].map(h=>'<th style="padding:10px 16px;text-align:left;font-weight:600;color:#64748b;white-space:nowrap;">'+h+'</th>').join('')+'</tr></thead>'+
        '<tbody>'+jobs.map(j=>'<tr style="border-bottom:1px solid rgba(255,255,255,0.4);"><td style="padding:10px 16px;font-weight:700;white-space:nowrap;">'+j.jobNo+'</td><td style="padding:10px 16px;">'+esc(j.customer)+'</td><td style="padding:10px 16px;">'+esc(j.staff)+'</td><td style="padding:10px 16px;">'+statusBadge(j.status)+'</td><td style="padding:10px 16px;">'+paidBadge(j.paid)+'</td><td style="padding:10px 16px;font-weight:700;white-space:nowrap;">'+money(j.price)+' ฿</td><td style="padding:10px 16px;">'+dateText(j.deliveryDate)+'</td></tr>').join('')+
        '</tbody></table></div></div>';
}

// ─── Edit Job Modal ─────────────────────────────────────────────────────────────
function openEditModal(jobId,asRequest){
  const job=state.jobs.find(j=>j.id===jobId);if(!job)return;
  const jt=['เลี่ยมกรอบใส','ตั้งกรอบ','ทำห่วง','ซ่อม','รีเวิร์ค','อื่นๆ'];
  const pm=['เงินสด','โอนเงิน','QR Code','บัตรเครดิต','อื่นๆ'];
  const so=['รับงาน','รอข้อมูล','กำลังทำ','เสร็จแล้ว','พบปัญหา','แก้ไขใหม่','ลูกค้ารับแล้ว','ยกเลิก'];
  const o=document.getElementById('modal-overlay');
  o._editTypes=[...job.types];o._editJobId=jobId;o._asRequest=asRequest;
  o.style.display='flex';
  o.innerHTML='<div class="glass" style="width:100%;max-width:700px;max-height:90vh;overflow-y:auto;padding:28px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">'+
      '<div><h3 style="font-size:20px;font-weight:800;">'+(asRequest?'ขอแก้ไขงาน ':'แก้ไขงาน ')+job.jobNo+'</h3>'+
      '<p style="font-size:13px;color:#94a3b8;">'+(asRequest?'จะส่งให้เจ้าของอนุมัติ':'เจ้าของ: บันทึกทันที')+'</p></div>'+
      '<button class="btn-secondary" style="padding:8px 14px;" onclick="closeModal()">ปิด</button>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">'+
      mInp('ชื่อลูกค้า','em_customer',job.customer)+mInp('เบอร์โทร','em_phone',job.phone)+
      mInp('LINE ID','em_line',job.line||'')+mInp('รายละเอียดงาน','em_details',job.details)+
      mInp('ราคา','em_price',String(job.price),'number')+mSel('วิธีชำระ','em_payMethod',pm,job.payMethod)+
      mSel('สถานะชำระ','em_paid',['ชำระแล้ว','ค้างชำระ'],job.paid?'ชำระแล้ว':'ค้างชำระ')+mSel('สถานะงาน','em_status',so,job.status)+
      mInp('วันนัดส่ง','em_deliveryDate',job.deliveryDate,'date')+mInp('เวลานัดส่ง','em_deliveryTime',job.deliveryTime,'time')+
    '</div>'+
    '<div style="font-weight:700;margin-bottom:10px;">ประเภทงาน</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">'+jt.map(t=>'<button class="'+(job.types.includes(t)?'btn-primary':'btn-secondary')+'" style="padding:6px 12px;font-size:13px;" onclick="toggleEmType(this,\''+t+'\')">' +t+'</button>').join('')+'</div>'+
    '<div style="display:flex;justify-content:flex-end;gap:10px;">'+
      '<button class="btn-secondary" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn-primary" onclick="saveEdit('+jobId+','+asRequest+')">'+(asRequest?'ส่งคำขอ':'บันทึก')+'</button>'+
    '</div></div>';
}
function mInp(label,id,val,type){type=type||'text';return '<label><div style="font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">'+label+'</div><input class="input-field" type="'+type+'" id="'+id+'" value="'+esc(val||'')+'"/></label>';}
function mSel(label,id,opts,val){return '<label><div style="font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">'+label+'</div><select class="input-field" id="'+id+'">'+opts.map(o=>'<option value="'+o+'"'+(o===val?' selected':'')+'>'+o+'</option>').join('')+'</select></label>';}
function toggleEmType(btn,t){const o=document.getElementById('modal-overlay');if(!o._editTypes)o._editTypes=[];if(o._editTypes.includes(t)){o._editTypes=o._editTypes.filter(x=>x!==t);btn.className='btn-secondary';btn.style.cssText='padding:6px 12px;font-size:13px;';}else{o._editTypes.push(t);btn.className='btn-primary';btn.style.cssText='padding:6px 12px;font-size:13px;';}}
function saveEdit(jobId,asRequest){
  const g=id=>document.getElementById(id)?.value||'';
  const patch={customer:g('em_customer'),phone:g('em_phone'),line:g('em_line'),details:g('em_details'),price:Number(g('em_price'))||0,payMethod:g('em_payMethod'),paid:g('em_paid')==='ชำระแล้ว',status:g('em_status'),deliveryDate:g('em_deliveryDate'),deliveryTime:g('em_deliveryTime'),types:document.getElementById('modal-overlay')._editTypes||[]};
  if(asRequest){const job=state.jobs.find(j=>j.id===jobId);const req={id:Date.now(),type:'edit',jobId,jobNo:job?.jobNo||'',by:state.staffName,at:new Date().toLocaleString('th-TH'),patch};state.approvals=[req,...state.approvals];save('nrd_apv',state.approvals);showToast('ส่งคำขอแก้ไขไปยังเจ้าของแล้ว');renderNav();}
  else{updateJob(jobId,patch);showToast('บันทึกการแก้ไขแล้ว');}
  closeModal();renderDetail();
}

// ─── Issue Modal ────────────────────────────────────────────────────────────────
function openIssueModal(jobId){
  const job=state.jobs.find(j=>j.id===jobId);if(!job)return;
  const o=document.getElementById('modal-overlay');o.style.display='flex';
  o.innerHTML='<div class="glass" style="width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:28px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">'+
      '<h3 style="font-size:20px;font-weight:800;">รายงานปัญหา '+job.jobNo+'</h3>'+
      '<button class="btn-secondary" style="padding:8px 14px;" onclick="closeModal()">ปิด</button>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">'+
      mSel('ประเภทปัญหา','im_type',['กรอบมีรอย','ไม่ตรงคำสั่ง','ห่วงไม่แน่น','ซีลกันน้ำมีปัญหา','ขนาดผิด','ลูกค้าขอเปลี่ยน','เสียหายระหว่างทำ','อื่นๆ'],'กรอบมีรอย')+
      mSel('ความเร่งด่วน','im_priority',['ต่ำ','ปานกลาง','สูง','เร่งด่วน'],'ปานกลาง')+
      mSel('รับผิดชอบโดย','im_staff',['ช่าง 1','ช่าง 2','ช่าง 3'],job.staff||'ช่าง 1')+
      mInp('วันที่คาดว่าจะแก้ไข','im_reworkDate','','date')+
    '</div>'+
    '<label style="display:block;margin-bottom:16px;"><div style="font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">รายละเอียดปัญหา</div>'+
      '<textarea class="input-field" id="im_details" placeholder="อธิบายปัญหาที่พบ..."></textarea></label>'+
    '<div style="display:flex;justify-content:flex-end;gap:10px;">'+
      '<button class="btn-secondary" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn-primary" onclick="saveIssue('+jobId+')">บันทึกปัญหา</button>'+
    '</div></div>';
}
function saveIssue(jobId){
  const g=id=>document.getElementById(id)?.value||'';
  const issue={type:g('im_type'),priority:g('im_priority'),staff:g('im_staff'),reworkDate:g('im_reworkDate'),details:g('im_details'),by:state.staffName,at:new Date().toLocaleString('th-TH')};
  updateJob(jobId,{status:'พบปัญหา',issue});showToast('บันทึกปัญหาแล้ว');closeModal();renderDetail();
}

function closeModal(){const o=document.getElementById('modal-overlay');o.style.display='none';o.innerHTML='';}

// ─── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',function(){document.getElementById('app').style.display='none';});
</script>
</body>
